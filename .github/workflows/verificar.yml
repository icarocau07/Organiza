name: Verificar arquivos do Organiza

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar sintaxe JavaScript
        run: |
          for file in site/*.js; do
            node --check "$file"
          done
      - name: Validar funções do Netlify e scripts Web Push
        run: npm run check
      - name: Conferir arquivos locais referenciados nos HTMLs
        run: python3 scripts/verificar_links.py
